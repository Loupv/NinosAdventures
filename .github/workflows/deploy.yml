# Publie le jeu sur GitHub Pages à chaque poussée sur `main`.
#
# Le build est entièrement statique (Vite, `base: './'`), donc il tourne aussi bien
# depuis un sous-dossier — c'est ce qui permet à Pages de le servir sous /NinosAdventures/
# sans qu'on ait à réécrire un seul chemin.
name: Publier le jeu

on:
  push:
    branches: [main]
  # Et à la demande, depuis l'onglet Actions.
  workflow_dispatch:

# Les droits dont Pages a besoin, et rien de plus.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; si deux poussées se suivent, la dernière gagne.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `npm run build` passe d'abord le typage, puis Vite : un jeu qui ne compile pas
      # ne doit pas remplacer celui qui marche.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
